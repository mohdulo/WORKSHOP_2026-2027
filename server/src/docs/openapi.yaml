      summary: Créer un remboursement
      description: |
        Le payment intent doit être `succeeded` (`409 payment_intent_unexpected_state` sinon). `amount` par défaut = reste
        remboursable ; la somme des remboursements ne peut pas dépasser le montant capturé (`400 amount_too_large`).
        `refund_application_fee: true` (paiement partagé seulement) restitue au vendeur la part de commission correspondante.
        Le client est toujours remboursé, même si le solde du vendeur devient négatif. Événements `refund.created`, `charge.refunded`.
