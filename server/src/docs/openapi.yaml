      tags: [Abonnements]
      summary: Résilier un abonnement
      description: |
        Immédiat (défaut) : `canceled`, les factures `open` passent `void`. `at_period_end: true` : résiliation programmée
        à `current_period_end` sans nouvelle facture. Déjà résilié, ou `incomplete` avec `at_period_end` → `409 state_error`.
      operationId: cancelSubscription
