  # ---------------------------------------------------------------- Abonnements
  /v1/subscriptions:
    post:
      tags: [Abonnements]
      summary: Créer un abonnement
      description: |
        Le prix doit être récurrent (`400 price_not_recurring`). Moyen de paiement : `default_payment_method`, sinon
        `customer.invoice_settings.default_payment_method`.
        - avec `trial_period_days` : `trialing`, première facture à la fin de l'essai ;
        - sinon : facture `subscription_create` payée immédiatement hors session → `active` ; refus (ou aucun moyen de
          paiement) → `incomplete`, facture `open` à régler via `POST /v1/invoices/{id}/pay` (pas de relance automatique).
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
            examples:
              immediat:
                summary: Abonnement facturé immédiatement
                value: { customer: cus_o34T0KX2MlBFoyU3z6kgKXp2, price: price_7DKNpBxQf2KvtYhpsx880H45, metadata: { plan: mensuel } }
              essai:
                summary: Avec 14 jours d'essai
                value: { customer: cus_o34T0KX2MlBFoyU3z6kgKXp2, price: price_7DKNpBxQf2KvtYhpsx880H45, trial_period_days: 14 }
      responses:
        '200':
          description: Abonnement créé (`trialing`, `active` ou `incomplete`). Événement `customer.subscription.created`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Abonnements]
      summary: Lister les abonnements
      operationId: listSubscriptions
      parameters:
        - name: customer
          in: query
          description: Ne garder que les abonnements de ce client.
          schema:
            type: string
        - name: status
          in: query
          description: Filtrer par statut.
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/starting_after'
      responses:
        '200':
          description: Liste paginée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/subscriptionId'
    get:
      tags: [Abonnements]
      summary: Lire un abonnement
      operationId: getSubscription
      responses:
        '200':
          description: L'abonnement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Abonnements]
      summary: Modifier un abonnement
      description: Change le moyen de paiement par défaut (`null` pour revenir à celui du client) ou programme / annule la résiliation en fin de période. Événement `customer.subscription.updated`.
      operationId: updateSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdate'
            example:
              cancel_at_period_end: true
      responses:
        '200':
          description: Abonnement mis à jour.
          content:
