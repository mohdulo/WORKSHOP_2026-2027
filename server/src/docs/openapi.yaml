openapi: 3.1.0
# Spécification écrite à la main : source de vérité de la documentation (servie sur /openapi.json et /docs).
# test/docs.test.js vérifie qu'elle est valide et que chaque route Express y figure (et réciproquement).
info:
  title: PaySim API
  version: 0.1.0
  summary: Prestataire de paiement simulé (projet EPSI)
  description: |
    PaySim est un **PSP (prestataire de services de paiement) codé de A à Z** : coffre-fort carte, autorisation / capture,
    3-D Secure, remboursements, marketplace, abonnements, webhooks signés et grand livre en partie double.

    > ⚠️ Les banques et réseaux carte sont **simulés**. Aucun argent réel ne circule.

    ## Authentification

    `Authorization: Bearer <clé>`

    - **Clé secrète** `sk_test_…` : tous les droits (serveur marchand, tableau de bord). Ne jamais l'exposer à un navigateur.
    - **Clé publique** `pk_test_…` : tokenisation d'une carte et, avec le `client_secret` du payment intent,
      confirmation, 3-D Secure et lecture du statut. La clé secrète est acceptée partout où la clé publique l'est.

    Clés de test par défaut (bouton *Authorize*) : `sk_test_paysimDevSecretKey000000000000` et
    `pk_test_paysimDevPublishableKey00000000`.

    ## Conventions

    - **Montants** : entiers en centimes, devise `eur` uniquement.
    - **Dates** : horodatages Unix en secondes (`created`, `current_period_end`, …).
    - **Identifiants** : préfixe + 24 caractères (`pi_`, `ch_`, `re_`, `cus_`, `pm_`, `acct_`, `tr_`, `po_`, `prod_`, `price_`,
      `sub_`, `in_`, `evt_`, `we_`, `whd_`, `txn_`, `tds_`).
    - **Listes** : `?limit=` (1 à 100, défaut 10) et `?starting_after=<id>` (curseur) ; réponse
      `{ "object": "list", "data": [...], "has_more": true|false }`, du plus récent au plus ancien.
    - **Idempotence** : en-tête `Idempotency-Key` sur tout `POST /v1/*`. Même clé + même requête → réponse rejouée à
      l'identique avec `Idempotent-Replayed: true` ; même clé + requête différente → `409 idempotency_error`. Expiration 24 h.
    - **Erreurs** : `{ "error": { "type", "code", "message", "param"? } }`, voir le schéma `Error`.
    - **Limite de débit** : 300 requêtes par minute sur `/v1` et `/demo` (`429 rate_limit_error`).

    ## Cartes de test

    | Numéro | Résultat |
    |---|---|
    | 4242 4242 4242 4242 | acceptée (Visa) |
    | 5555 5555 5555 4444 | acceptée (Mastercard) |
    | 4000 0000 0000 3220 | 3-D Secure demandé (`requires_action`) |
    | 4000 0000 0000 0002 | refusée `card_declined` |
    | 4000 0000 0000 9995 | refusée `insufficient_funds` |
    | 4000 0000 0000 0069 | refusée `expired_card` |
    | 4000 0000 0000 0127 | `cvc_check: fail`, paiement refusé `incorrect_cvc` |
    | 4000 0000 0000 0341 | enregistrable, tout paiement refusé (tests de relance) |

    N'importe quelle date future et n'importe quel CVC conviennent. Montant > 999 999 centimes : refusé `amount_too_large`.
  contact:
    name: PaySim — projet EPSI
    url: https://github.com/mohdulo/WORKSHOP_2026-2027

servers:
  - url: /
    description: Ce serveur (même origine que la documentation)
  - url: http://localhost:4000
    description: Serveur local (npm start ou Docker)

tags:
  - name: Système
    description: État du service et spécification OpenAPI. Sans clé API.
  - name: Clients
    description: 'Clients (`cus_`) : e-mail, nom, métadonnées et moyen de paiement par défaut pour les factures.'
  - name: Moyens de paiement
    description: |
      Coffre-fort carte (`pm_`). Le numéro part **directement du navigateur vers PaySim** avec la clé publique : il est
      chiffré AES-256-GCM, le CVC est vérifié puis jamais stocké. Marques : visa, mastercard, amex.
  - name: Paiements
    description: |
      Payment intents (`pi_`), machine à états :
      `requires_payment_method → requires_confirmation → (requires_action) → requires_capture | succeeded`, ou `canceled`.
      Un refus ramène le payment intent à `requires_payment_method` (`last_payment_error`). Chaque autorisation crée une
      charge (`ch_`). Les écritures du grand livre sont passées à la capture. Une autorisation non capturée expire après 7 jours.
  - name: Remboursements
    description: Remboursements (`re_`) totaux ou partiels d'un paiement capturé, avec restitution optionnelle de la commission plateforme.
  - name: Marketplace
    description: |
      Comptes vendeurs (`acct_`), paiements partagés (`transfer_data.destination` + `application_fee_amount`),
      transferts (`tr_`) de la plateforme vers un vendeur et payouts (`po_`, virement bancaire simulé).
  - name: Catalogue
    description: Produits (`prod_`) et prix (`price_`), ponctuels ou récurrents.
  - name: Abonnements
    description: |
      Abonnements (`sub_`) et factures (`in_`). Sans essai, la première facture est payée immédiatement (hors session) :
      succès → `active`, refus → `incomplete`. Relances automatiques à +1 j, +3 j, +5 j (`past_due`), puis
      `uncollectible` et résiliation après 4 échecs. L'horloge de test fait avancer la facturation.
  - name: Webhooks
    description: |
      Endpoints (`we_`) et livraisons (`whd_`). Chaque événement est envoyé en `POST` JSON signé
      (`PaySim-Signature: t=…,v1=HMAC-SHA256`) ; nouvelles tentatives après 1 min, 5 min, 30 min, 2 h et 8 h.
      Voir la section *Webhooks* en bas de page pour le format reçu par le marchand.
  - name: Événements
    description: Journal des événements (`evt_`) émis par PaySim, consultable et filtrable par type.
  - name: Grand livre
    description: |
      Grand livre en partie double : chaque opération (capture, remboursement, transfert, payout) est une transaction
      dont la somme des écritures vaut 0. Comptes `network_receivable`, `platform_balance`, `psp_revenue`, `bank_payouts`,
      `merchant:<acct_id>`.
  - name: Horloge de test
    description: |
      Avance du temps simulé : expiration des autorisations, cycle de facturation et livraison des webhooks.
      Désactivée en production (`NODE_ENV=production` → 404).
  - name: Démo marchand
    description: |
      Backend du commerçant de démonstration (« Comptoir des Pentes »), **sans clé API** : il agit avec la clé secrète
      en interne, qui n'est jamais renvoyée. Le montant vient toujours du catalogue serveur.

security:
  - secretKey: []

paths:
  # ---------------------------------------------------------------- Système
  /health:
    get:
      tags: [Système]
      summary: État du service
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Le serveur répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.json:
    get:
      tags: [Système]
      summary: Spécification OpenAPI (JSON)
      operationId: getOpenApiJson
      security: []
      responses:
        '200':
          description: Ce document, au format JSON.
          content:
            application/json:
              schema:
                type: object
  /openapi.yaml:
    get:
      tags: [Système]
      summary: Spécification OpenAPI (YAML)
      operationId: getOpenApiYaml
      security: []
      responses:
        '200':
          description: Ce document, au format YAML (fichier source `server/src/docs/openapi.yaml`).
          content:
            application/yaml:
              schema:
                type: string

  # ---------------------------------------------------------------- Clients
  /v1/customers:
    post:
      tags: [Clients]
      summary: Créer un client
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              email: alice@example.com
              name: Alice Martin
              metadata: { crm_id: '42' }
      responses:
        '200':
          description: Client créé (événement `customer.created`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Clients]
      summary: Lister les clients
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/starting_after'
      responses:
        '200':
          description: Liste paginée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/customerId'
    get:
      tags: [Clients]
      summary: Lire un client
      operationId: getCustomer
      responses:
        '200':
          description: Le client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Clients]
      summary: Modifier un client
      description: |
        Modification partielle. `invoice_settings.default_payment_method` désigne le moyen de paiement (déjà rattaché au client)
        utilisé par défaut pour les factures d'abonnement ; `null` pour le retirer.
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
            example:
              name: Alice Martin-Dupont
              invoice_settings: { default_payment_method: pm_CaNPHU2gQyuNSpmzIsMC9qOw }
      responses:
        '200':
          description: Client mis à jour (événement `customer.updated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/customers/{id}/payment_methods:
    parameters:
      - $ref: '#/components/parameters/customerId'
    get:
      tags: [Moyens de paiement]
      summary: Lister les moyens de paiement d'un client
      operationId: listCustomerPaymentMethods
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/starting_after'
      responses:
        '200':
          description: Moyens de paiement rattachés au client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Moyens de paiement
  /v1/payment_methods:
    post:
      tags: [Moyens de paiement]
      summary: Tokeniser une carte
      description: |
        **Clé publique** : appel fait depuis le navigateur, la carte ne transite jamais par le serveur marchand.
        Vérifications : Luhn, 13 à 19 chiffres, marque supportée, date non expirée, CVC de 3 ou 4 chiffres.
        Le CVC est contrôlé par le réseau simulé (`cvc_check`) puis oublié. Le numéro n'apparaît jamais dans une réponse
        d'erreur ni dans les logs.
      operationId: createPaymentMethod
      security:
        - publishableKey: []
        - secretKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodCreate'
            example:
              card: { number: '4242424242424242', exp_month: 12, exp_year: 2030, cvc: '123' }
      responses:
        '200':
          description: Moyen de paiement créé, non rattaché (événement `payment_method.created`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Carte invalide (`card_invalid`, `card_expired`, `card_brand_unsupported`, `parameter_invalid`…).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_methods/{id}:
    parameters:
      - $ref: '#/components/parameters/paymentMethodId'
    get:
      tags: [Moyens de paiement]
      summary: Lire un moyen de paiement
      operationId: getPaymentMethod
      responses:
        '200':
          description: Le moyen de paiement (jamais le numéro complet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_methods/{id}/attach:
    parameters:
      - $ref: '#/components/parameters/paymentMethodId'
    post:
      tags: [Moyens de paiement]
      summary: Rattacher un moyen de paiement à un client
      description: Un moyen de paiement ne peut être rattaché qu'à un seul client (`400 payment_method_already_attached` sinon).
      operationId: attachPaymentMethod
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodAttach'
            example:
              customer: cus_o34T0KX2MlBFoyU3z6kgKXp2
      responses:
        '200':
          description: Moyen de paiement rattaché (événement `payment_method.attached`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Paiements
  /v1/payment_intents:
    post:
      tags: [Paiements]
      summary: Créer un payment intent
      description: |
        Avec `confirm: true` et un `payment_method`, l'autorisation est tentée immédiatement :
        - carte acceptée → `succeeded` (capture automatique) ou `requires_capture` (`capture_method: manual`) ;
        - 3-D Secure requis → `requires_action` avec `next_action.challenge_id`, à terminer via `POST /v1/three_ds/{challenge_id}/complete` ;
        - carte refusée → **402 `card_error`**, le payment intent (dans `error.payment_intent`) revient à `requires_payment_method`.

        Paiement partagé (marketplace) : `transfer_data.destination` (compte vendeur) et `application_fee_amount`
        (commission plateforme, strictement inférieure au montant capturé).
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCreate'
            examples:
              immediat:
                summary: Paiement immédiat
                value: { amount: 2500, currency: eur, payment_method: pm_CaNPHU2gQyuNSpmzIsMC9qOw, confirm: true, description: 'Commande #42', metadata: { order: '42' } }
              autorisation:
                summary: Autorisation puis capture manuelle
                value: { amount: 4800, currency: eur, payment_method: pm_VzDhMQq7LkDayETaQwR4sexI, capture_method: manual, confirm: true }
              marketplace:
                summary: Paiement partagé avec un vendeur
                value: { amount: 4800, currency: eur, payment_method: pm_jS0bpAzKbzuDiJckCCtfuxQi, confirm: true, application_fee_amount: 720, transfer_data: { destination: acct_eB2xjnH1aoaSaMEQwloapmt4 } }
              differe:
                summary: Création seule (confirmation plus tard, côté navigateur)
                value: { amount: 1250, currency: eur }
      responses:
        '200':
          description: Payment intent créé (et confirmé si demandé).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CardDeclined' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Paiements]
      summary: Lister les payment intents
      operationId: listPaymentIntents
      parameters:
        - name: customer
          in: query
          description: Ne garder que les payment intents de ce client.
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/starting_after'
      responses:
        '200':
          description: Liste paginée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_intents/{id}:
    parameters:
      - $ref: '#/components/parameters/paymentIntentId'
    get:
      tags: [Paiements]
      summary: Lire un payment intent
      description: |
        Avec la clé **publique**, `?client_secret=` est obligatoire (`400 parameter_missing`) ; un secret faux ou d'un autre
        payment intent répond `404` (même réponse qu'un identifiant inconnu : pas d'oracle d'existence).
      operationId: getPaymentIntent
      security:
        - publishableKey: []
        - secretKey: []
      parameters:
        - name: client_secret
          in: query
          description: Secret du payment intent (`pi_…_secret_…`), requis avec une clé publique.
          schema:
            type: string
      responses:
        '200':
          description: Le payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_intents/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/paymentIntentId'
    post:
      tags: [Paiements]
      summary: Confirmer un payment intent
      description: |
        Tente l'autorisation avec `payment_method` (ou celui déjà associé). Avec la clé **publique**, le `client_secret`
        du payment intent est obligatoire dans le corps. Issues : `succeeded`, `requires_capture`, `requires_action`
        (3-D Secure) ou **402 `card_error`**. Statut incompatible → `409 state_error`.
      operationId: confirmPaymentIntent
      security:
        - publishableKey: []
        - secretKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentConfirm'
            example:
              payment_method: pm_CaNPHU2gQyuNSpmzIsMC9qOw
              client_secret: pi_KTCLNzEDFaN6qQa6lbKSlYO6_secret_bSMKPz_OabzaTgy20x2T_1Yc
      responses:
        '200':
          description: Payment intent mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CardDeclined' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_intents/{id}/capture:
    parameters:
      - $ref: '#/components/parameters/paymentIntentId'
    post:
      tags: [Paiements]
      summary: Capturer une autorisation
      description: |
        Statut requis : `requires_capture`. `amount_to_capture` (défaut : tout) doit être ≤ au montant autorisé ; le reste est
        libéré. Passe les écritures du grand livre (frais PSP `round(1,4 % × montant) + 25` centimes).
        Événements `charge.captured`, `payment_intent.succeeded`.
      operationId: capturePaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCapture'
            example:
              amount_to_capture: 4000
      responses:
        '200':
          description: Payment intent `succeeded`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/payment_intents/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/paymentIntentId'
    post:
      tags: [Paiements]
      summary: Annuler un payment intent
      description: Possible tant que le paiement n'est pas `succeeded` ni déjà `canceled` (sinon `409 state_error`). Une autorisation en attente est libérée.
      operationId: cancelPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCancel'
            example:
              cancellation_reason: requested_by_customer
      responses:
        '200':
          description: Payment intent `canceled` (événement `payment_intent.canceled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/three_ds/{challenge_id}/complete:
    post:
      tags: [Paiements]
      summary: Terminer un défi 3-D Secure
      description: |
        Simule la réponse de la banque au défi `tds_…` (`next_action.challenge_id`). `approve` reprend la confirmation
        (`succeeded` ou `requires_capture`) ; `deny` répond **402** `payment_intent_authentication_failure`
        (`decline_code: authentication_failed`). Avec la clé **publique**, `client_secret` est obligatoire.
      operationId: completeThreeDs
      security:
        - publishableKey: []
        - secretKey: []
      parameters:
        - name: challenge_id
          in: path
          required: true
          description: Identifiant du défi (`tds_…`).
          schema:
            type: string
          example: tds_fQyfJBheytPmV6pB1arKrz4r
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDsComplete'
            example:
              result: approve
              client_secret: pi_ShQ1O5IqmNgrvlmerqbjwo2d_secret_xyhJO3Mhs9puYoblSiYEqIC1
      responses:
        '200':
          description: Payment intent après authentification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/CardDeclined' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
