# ====================================================================== Webhooks sortants
webhooks:
  event:
    post:
      tags: [Webhooks]
      summary: Événement livré à votre endpoint
      description: |
        Pour chaque événement correspondant à `enabled_events`, PaySim envoie un `POST` JSON à l'URL de l'endpoint
        (timeout 5 s, redirections refusées). Répondre **2xx** vaut accusé de réception ; sinon nouvelles tentatives après
        1 min, 5 min, 30 min, 2 h et 8 h, puis livraison `failed`. Livraison « au moins une fois » : dédupliquer par `id`.

        **Signature** : `PaySim-Signature: t=<timestamp Unix>,v1=<hex HMAC-SHA256(secret, "<t>.<corps brut>")>`.
        Vérifier sur les octets reçus (jamais sur un JSON re-sérialisé), avec une tolérance de 300 s sur `t`
        (temps réel). Plusieurs `v1=` peuvent être présents. Utilitaire autonome : `server/src/modules/webhooks/verify.js`.
      parameters:
        - name: PaySim-Signature
          in: header
          required: true
          description: Horodatage et signature(s) HMAC-SHA256 du corps brut.
          schema:
            type: string
          example: t=1767225600,v1=4a7d1ed414474e4033ac29ccb8653d9b9ad9dbf64f4a5a2a37ab9c8a2f4e0c1d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Reçu (tout code 2xx est accepté).

# ====================================================================== Composants
components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test_…
      description: 'Clé secrète (`sk_test_…`) : tous les droits. À n''utiliser que côté serveur.'
    publishableKey:
      type: http
      scheme: bearer
      bearerFormat: pk_test_…
      description: 'Clé publique (`pk_test_…`) : tokenisation et opérations munies du `client_secret` du payment intent.'

  headers:
    Idempotent-Replayed:
      description: Présent (valeur `true`) quand la réponse est la copie d'une requête précédente portant la même `Idempotency-Key`.
      schema:
        type: string
        enum: ['true']

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clé d'idempotence (1 à 255 caractères) propre à la clé API. Même clé + même requête → réponse rejouée
        (`Idempotent-Replayed: true`) ; même clé + méthode, chemin ou corps différent → `409 idempotency_key_reused` ;
        requête encore en cours → `409 idempotency_key_in_use`. Expiration 24 h.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: commande-42
    limit:
      name: limit
      in: query
      description: Nombre maximal d'objets renvoyés (1 à 100, défaut 10).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    starting_after:
      name: starting_after
      in: query
      description: Curseur, identifiant du dernier objet de la page précédente (`400 resource_missing` s'il n'existe pas).
      schema:
        type: string
    customerId:
      name: id
      in: path
      required: true
      description: Identifiant du client (`cus_…`).
      schema:
        type: string
      example: cus_o34T0KX2MlBFoyU3z6kgKXp2
    paymentMethodId:
      name: id
      in: path
      required: true
      description: Identifiant du moyen de paiement (`pm_…`).
      schema:
        type: string
      example: pm_CaNPHU2gQyuNSpmzIsMC9qOw
    paymentIntentId:
      name: id
      in: path
      required: true
      description: Identifiant du payment intent (`pi_…`).
      schema:
        type: string
      example: pi_MR6CPNmfpuTMzysaMJBJPmHl
    accountId:
      name: id
      in: path
      required: true
      description: Identifiant du compte vendeur (`acct_…`).
      schema:
        type: string
      example: acct_eB2xjnH1aoaSaMEQwloapmt4
    subscriptionId:
      name: id
      in: path
      required: true
      description: Identifiant de l'abonnement (`sub_…`).
      schema:
        type: string
      example: sub_vOmzmoPAusAZVOEAtg3OlfRC
    invoiceId:
      name: id
      in: path
      required: true
      description: Identifiant de la facture (`in_…`).
      schema:
        type: string
      example: in_mY2HgQ6DGTAmd7qapBMF3jf0
    webhookEndpointId:
      name: id
      in: path
      required: true
      description: Identifiant du webhook endpoint (`we_…`).
      schema:
        type: string
      example: we_lFzBmZ3yY3Gqp678xapqhLOw

  responses:
    BadRequest:
      description: Requête invalide (`invalid_request_error`) — paramètre manquant ou invalide, champ inconnu, objet référencé inexistant, JSON mal formé.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            parametre:
              summary: Paramètre invalide
              value: { error: { type: invalid_request_error, code: parameter_invalid, message: 'email : Invalid email address', param: email } }
            reference:
              summary: Objet référencé inexistant
              value: { error: { type: invalid_request_error, code: resource_missing, message: 'Aucun(e) payment_method avec l''id "pm_inconnu".', param: payment_method } }
    Unauthorized:
      description: Clé API absente, mal formée ou inconnue (`authentication_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: { type: authentication_error, code: missing_api_key, message: 'Aucune clé API fournie. Utilisez « Authorization: Bearer <clé> ».' } }
    Forbidden:
      description: Clé publique sur une route réservée à la clé secrète (`permission_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: { type: permission_error, code: secret_key_required, message: 'Cette route exige la clé secrète (sk_test_...).' } }
    NotFound:
      description: Objet inexistant (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: { type: not_found, code: resource_missing, message: 'Aucun(e) customer avec l''id "cus_inconnu".', param: id } }
    Conflict:
      description: Transition d'état interdite (`state_error`) ou conflit d'idempotence (`idempotency_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            etat:
              summary: Transition interdite
              value: { error: { type: state_error, code: payment_intent_unexpected_state, message: 'Action « capture » impossible : le payment intent pi_… est au statut « canceled » (statuts permis : requires_capture).' } }
            idempotence:
              summary: Idempotency-Key réutilisée avec une autre requête
              value: { error: { type: idempotency_error, code: idempotency_key_reused, message: 'Cette Idempotency-Key a déjà été utilisée avec une requête différente (méthode, chemin ou corps).' } }
    CardDeclined:
      description: |
        Carte refusée (`card_error`). `code` : `card_declined`, `expired_card`, `incorrect_cvc`, `amount_too_large`,
        `payment_intent_authentication_failure` ; `decline_code` précise le motif (`insufficient_funds`,
        `authentication_required`, `authentication_failed`, …). L'échec est enregistré **avant** la réponse :
        `error.payment_intent` est le payment intent à jour (`requires_payment_method`, `last_payment_error` renseigné).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardError'
    InsufficientBalance:
      description: Solde insuffisant pour ce mouvement de fonds (`insufficient_balance`, type `invalid_request_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: { type: invalid_request_error, code: insufficient_balance, message: 'Solde vendeur insuffisant : 3180 disponible(s), 10000000 demandé(s).', param: amount } }
    TooManyRequests:
      description: Plus de 300 requêtes par minute (`rate_limit_error`). En-têtes `RateLimit-*` (draft-7).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: { type: rate_limit_error, code: rate_limit, message: 'Trop de requêtes, réessayez plus tard.' } }

  schemas:
    # ------------------------------------------------------------ Types de base
    Timestamp:
      type: integer
      description: Horodatage Unix en secondes.
      examples: [1767225600]
    Amount:
      type: integer
      description: Montant en centimes (entier).
      minimum: 1
      maximum: 99999999
      examples: [2500]
    Currency:
      type: string
      description: Devise ISO 4217 en minuscules. Seul `eur` est accepté.
      enum: [eur]
    Metadata:
      type: object
      description: Paires clé/valeur libres (50 clés max, clés de 40 caractères max, valeurs de 500 caractères max).
      maxProperties: 50
      propertyNames:
        minLength: 1
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500
      examples: [{ order: '42' }]
    List:
      type: object
      description: Enveloppe de liste paginée, du plus récent au plus ancien.
      required: [object, data, has_more]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items: {}
        has_more:
          type: boolean
          description: Vrai s'il reste des objets après le dernier de `data` (relancer avec `starting_after`).
    Deleted:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          type: boolean
          enum: [true]
      examples: [{ id: we_lFzBmZ3yY3Gqp678xapqhLOw, object: webhook_endpoint, deleted: true }]
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    # ------------------------------------------------------------ Erreurs
    Error:
      type: object
      description: Toute erreur de l'API (HTTP 4xx / 5xx).
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              description: Famille d'erreur, liée au code HTTP.
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found
                - card_error
                - idempotency_error
                - state_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: Code précis (`parameter_invalid`, `parameter_missing`, `resource_missing`, `amount_too_large`, `invalid_api_key`, `payment_intent_unexpected_state`, …).
            message:
              type: string
              description: Message lisible, en français. Ne contient jamais un numéro de carte ni un secret.
            param:
              type: string
              description: Paramètre en cause, le cas échéant (`card.number`, `amount`, `limit`, `id`, …).
          additionalProperties: true
      examples:
        - error: { type: invalid_request_error, code: parameter_invalid, message: 'limit doit être un entier entre 1 et 100.', param: limit }
    LastPaymentError:
      type: object
      description: Dernier refus enregistré sur un payment intent ou une facture.
      required: [type, code, message]
      properties:
        type:
          type: string
          enum: [card_error]
        code:
          type: string
          description: '`card_declined`, `expired_card`, `incorrect_cvc`, `amount_too_large`, `payment_intent_authentication_failure`, `payment_method_missing`.'
        decline_code:
          type: [string, 'null']
          description: Motif du réseau (`card_declined`, `insufficient_funds`, `expired_card`, `incorrect_cvc`, `authentication_required`, `authentication_failed`, `amount_too_large`).
        message:
          type: string
        charge:
          type: [string, 'null']
          description: Charge `failed` correspondante (`ch_…`).
        payment_method:
          type: [string, 'null']
      additionalProperties: true
      examples:
        - { type: card_error, code: card_declined, decline_code: card_declined, message: La carte a été refusée., charge: ch_KxCC5XYp7EYYcH6NIGECLMNb, payment_method: pm_BYy98BXByKn2WdMB3oqchDeO }
    CardError:
      type: object
      description: Réponse 402 d'un refus carte sur un payment intent ou une facture.
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, decline_code, payment_intent]
          properties:
            type:
              type: string
              enum: [card_error]
            code:
              type: string
            message:
              type: string
            decline_code:
              type: string
            charge:
              type: [string, 'null']
              description: Charge `failed` créée par la tentative (`ch_…`), `null` si le réseau n'a pas été sollicité.
            payment_intent:
              $ref: '#/components/schemas/PaymentIntent'
      examples:
        - error:
            type: card_error
            code: card_declined
            message: La carte a été refusée.
            decline_code: card_declined
            charge: ch_KxCC5XYp7EYYcH6NIGECLMNb
            payment_intent:
              id: pi_DcpYTLHSGBQ6DBazM8T4Zo39
              object: payment_intent
              amount: 1500
              amount_capturable: 0
              amount_received: 0
              currency: eur
              status: requires_payment_method
              capture_method: automatic
              customer: null
              payment_method: null
              off_session: false
              application_fee_amount: null
              transfer_data: null
              description: null
              metadata: {}
              last_payment_error: { type: card_error, code: card_declined, decline_code: card_declined, message: La carte a été refusée., charge: ch_KxCC5XYp7EYYcH6NIGECLMNb, payment_method: pm_BYy98BXByKn2WdMB3oqchDeO }
              next_action: null
              latest_charge: ch_KxCC5XYp7EYYcH6NIGECLMNb
              canceled_at: null
              cancellation_reason: null
              created: 1767225600
              client_secret: pi_DcpYTLHSGBQ6DBazM8T4Zo39_secret_rKLWAEC6cMNmYsbBeWWOW0ly
    DemoCardError:
      type: object
      description: Réponse 402 de `POST /demo/subscribe`.
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, decline_code, subscription, invoice]
          properties:
            type:
              type: string
              enum: [card_error]
            code:
              type: string
            message:
              type: string
            decline_code:
              type: string
            subscription:
              $ref: '#/components/schemas/DemoSubscriptionSummary'
            invoice:
              $ref: '#/components/schemas/DemoInvoiceSummary'
      examples:
        - error:
            type: card_error
            code: card_declined
            message: La carte a été refusée.
            decline_code: card_declined
            subscription: { id: sub_MPUZdDW8MGiwZinhRDRMxuy5, status: incomplete, current_period_start: 1767229200, current_period_end: 1769907600 }
            invoice: { id: in_x1ZyJWWrEJebAPeHu6yxNNsn, status: open, amount_due: 990, amount_paid: 0, currency: eur }

    # ------------------------------------------------------------ Clients
    CustomerCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          minLength: 1
          maxLength: 200
        metadata:
          $ref: '#/components/schemas/Metadata'
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
        metadata:
          $ref: '#/components/schemas/Metadata'
        invoice_settings:
          type: object
          required: [default_payment_method]
          additionalProperties: false
          properties:
            default_payment_method:
              type: [string, 'null']
              description: Moyen de paiement (`pm_…`) déjà rattaché à ce client, ou `null`.
    Customer:
      type: object
      required: [id, object, email, name, metadata, invoice_settings, created]
      properties:
        id:
          type: string
          examples: [cus_o34T0KX2MlBFoyU3z6kgKXp2]
        object:
          type: string
          enum: [customer]
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        metadata:
          $ref: '#/components/schemas/Metadata'
        invoice_settings:
          type: object
          required: [default_payment_method]
          properties:
            default_payment_method:
              type: [string, 'null']
              description: Moyen de paiement utilisé par défaut pour les factures d'abonnement.
        created:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - { id: cus_o34T0KX2MlBFoyU3z6kgKXp2, object: customer, email: alice@example.com, name: Alice Martin, metadata: { crm_id: '42' }, invoice_settings: { default_payment_method: pm_CaNPHU2gQyuNSpmzIsMC9qOw }, created: 1767225600 }
    CustomerList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Customer'

    # ------------------------------------------------------------ Moyens de paiement
    PaymentMethodCreate:
      type: object
      required: [card]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [card]
        card:
          type: object
          required: [number, exp_month, exp_year, cvc]
          additionalProperties: false
          properties:
            number:
              type: string
              description: Numéro de carte (13 à 19 chiffres, Luhn valide ; espaces tolérés).
              minLength: 1
              maxLength: 32
            exp_month:
              type: integer
              minimum: 1
              maximum: 12
            exp_year:
              type: integer
              minimum: 2000
              maximum: 2200
            cvc:
              type: string
              description: 3 ou 4 chiffres. Vérifié puis jamais stocké.
              maxLength: 8
    PaymentMethodAttach:
      type: object
      required: [customer]
      additionalProperties: false
      properties:
        customer:
          type: string
          description: Client (`cus_…`) auquel rattacher le moyen de paiement.
    PaymentMethod:
      type: object
      required: [id, object, type, card, customer, created]
      properties:
        id:
          type: string
          examples: [pm_CaNPHU2gQyuNSpmzIsMC9qOw]
        object:
          type: string
          enum: [payment_method]
        type:
          type: string
          enum: [card]
        card:
          type: object
          required: [brand, last4, exp_month, exp_year, fingerprint, cvc_check]
          properties:
            brand:
              type: string
              enum: [visa, mastercard, amex]
            last4:
              type: string
              pattern: '^[0-9]{4}$'
            exp_month:
              type: integer
            exp_year:
              type: integer
            fingerprint:
              type: string
              description: HMAC-SHA256 du numéro de carte, stable pour une même carte (déduplication).
            cvc_check:
              type: string
              enum: [pass, fail]
        customer:
          type: [string, 'null']
          description: Client auquel le moyen de paiement est rattaché.
        created:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - { id: pm_CaNPHU2gQyuNSpmzIsMC9qOw, object: payment_method, type: card, card: { brand: visa, last4: '4242', exp_month: 12, exp_year: 2030, fingerprint: 05a62f7ca79521d4ad9629b58d8befcc5a27c8f068757900c9e8c561fad94275, cvc_check: pass }, customer: null, created: 1767225600 }
    PaymentMethodList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PaymentMethod'

    # ------------------------------------------------------------ Paiements
    PaymentIntentStatus:
      type: string
      enum: [requires_payment_method, requires_confirmation, requires_action, requires_capture, succeeded, canceled]
    PaymentIntentCreate:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        customer:
          type: string
          description: Client (`cus_…`). Si `payment_method` est rattaché à un client, ce doit être le même.
        payment_method:
          type: string
          description: Moyen de paiement (`pm_…`).
        capture_method:
          type: string
          enum: [automatic, manual]
          default: automatic
          description: '`manual` : autoriser maintenant (`requires_capture`), capturer plus tard (7 jours max).'
        confirm:
          type: boolean
          default: false
          description: Tenter l'autorisation immédiatement.
        off_session:
          type: boolean
          default: false
          description: Paiement sans le client (relance d'abonnement) ; une carte exigeant 3-D Secure est alors refusée `authentication_required`.
        application_fee_amount:
          type: integer
          minimum: 0
          description: Commission plateforme (centimes) sur un paiement partagé ; doit rester inférieure au montant capturé.
        transfer_data:
          type: object
          required: [destination]
          additionalProperties: false
          properties:
            destination:
              type: string
              description: Compte vendeur (`acct_…`) qui reçoit le montant moins la commission.
        description:
          type: string
          maxLength: 1000
        metadata:
          $ref: '#/components/schemas/Metadata'
    PaymentIntentConfirm:
      type: object
      additionalProperties: false
      properties:
        payment_method:
          type: string
          description: Moyen de paiement à utiliser (remplace celui du payment intent).
        client_secret:
          type: string
          description: Obligatoire avec la clé publique.
    PaymentIntentCapture:
      type: object
      additionalProperties: false
      properties:
        amount_to_capture:
          $ref: '#/components/schemas/Amount'
    PaymentIntentCancel:
      type: object
      additionalProperties: false
      properties:
        cancellation_reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer, abandoned]
    ThreeDsComplete:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          type: string
          enum: [approve, deny]
          description: Résultat simulé de l'authentification du porteur.
        client_secret:
          type: string
          description: Obligatoire avec la clé publique.
    PaymentIntent:
      type: object
      required:
        - id
        - object
        - amount
        - amount_capturable
        - amount_received
        - currency
        - status
        - capture_method
        - customer
        - payment_method
        - off_session
        - application_fee_amount
        - transfer_data
        - description
        - metadata
        - last_payment_error
        - next_action
        - latest_charge
        - canceled_at
        - cancellation_reason
        - created
      properties:
        id:
          type: string
          examples: [pi_MR6CPNmfpuTMzysaMJBJPmHl]
        object:
          type: string
          enum: [payment_intent]
        amount:
          type: integer
          description: Montant demandé (centimes).
        amount_capturable:
          type: integer
          description: Montant autorisé en attente de capture (`requires_capture`).
        amount_received:
          type: integer
          description: Montant capturé.
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/PaymentIntentStatus'
        capture_method:
          type: string
          enum: [automatic, manual]
        customer:
          type: [string, 'null']
        payment_method:
          type: [string, 'null']
          description: Moyen de paiement associé ; redevient `null` après un refus.
        off_session:
          type: boolean
        application_fee_amount:
          type: [integer, 'null']
        transfer_data:
          type: [object, 'null']
          properties:
            destination:
              type: string
        description:
          type: [string, 'null']
        metadata:
          $ref: '#/components/schemas/Metadata'
        last_payment_error:
          oneOf:
            - $ref: '#/components/schemas/LastPaymentError'
            - type: 'null'
        next_action:
          type: [object, 'null']
          description: Action attendue du client (`requires_action`).
          properties:
            type:
              type: string
              enum: [three_d_secure]
            challenge_id:
              type: string
              description: Défi à terminer via `POST /v1/three_ds/{challenge_id}/complete`.
        latest_charge:
          type: [string, 'null']
          description: Dernière charge créée (`ch_…`), réussie ou non.
        canceled_at:
          type: [integer, 'null']
        cancellation_reason:
          type: [string, 'null']
          description: '`duplicate`, `fraudulent`, `requested_by_customer`, `abandoned`, ou `expired` (autorisation de plus de 7 jours).'
        created:
          $ref: '#/components/schemas/Timestamp'
        client_secret:
          type: string
          description: Secret à transmettre au navigateur pour confirmer avec la clé publique. Absent des événements et des webhooks.
      examples:
        - { id: pi_MR6CPNmfpuTMzysaMJBJPmHl, object: payment_intent, amount: 2500, amount_capturable: 0, amount_received: 2500, currency: eur, status: succeeded, capture_method: automatic, customer: cus_o34T0KX2MlBFoyU3z6kgKXp2, payment_method: pm_CaNPHU2gQyuNSpmzIsMC9qOw, off_session: false, application_fee_amount: null, transfer_data: null, description: 'Commande #42', metadata: { order: '42' }, last_payment_error: null, next_action: null, latest_charge: ch_5GDhLjaWaek37aQAwDo9TbYY, canceled_at: null, cancellation_reason: null, created: 1767225600, client_secret: pi_MR6CPNmfpuTMzysaMJBJPmHl_secret__9lFbOcD_2hq2i5loBoHvGv_ }
    PaymentIntentList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PaymentIntent'
    Charge:
      type: object
      description: Une tentative d'autorisation, réussie ou refusée.
      required: [id, object, payment_intent, payment_method, customer, amount, amount_captured, amount_refunded, refunded, currency, status, captured, failure_code, failure_message, outcome, payment_method_details, created]
      properties:
        id:
          type: string
          examples: [ch_5GDhLjaWaek37aQAwDo9TbYY]
        object:
          type: string
          enum: [charge]
        payment_intent:
          type: string
        payment_method:
          type: string
        customer:
          type: [string, 'null']
        amount:
          type: integer
          description: Montant autorisé.
        amount_captured:
          type: integer
        amount_refunded:
          type: integer
        refunded:
          type: boolean
          description: Vrai quand tout le montant capturé a été remboursé.
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum: [succeeded, failed]
        captured:
          type: boolean
        failure_code:
          type: [string, 'null']
          description: Code d'erreur API du refus (`card_declined`, `expired_card`, `incorrect_cvc`, `amount_too_large`, …).
        failure_message:
          type: [string, 'null']
        outcome:
          type: object
          description: Décision du réseau simulé.
          required: [type, network_status, seller_message]
          properties:
            type:
              type: string
              enum: [authorized, issuer_declined]
            network_status:
              type: string
              enum: [approved_by_network, declined_by_network]
            reason:
              type: string
              description: Motif de refus (`decline_code`), présent si refusée.
            seller_message:
              type: string
        payment_method_details:
          type: object
          required: [type, card]
          properties:
            type:
              type: string
              enum: [card]
            card:
              type: object
              required: [brand, last4, three_d_secure]
              properties:
                brand:
                  type: string
                last4:
                  type: string
                three_d_secure:
                  type: [string, 'null']
                  description: '`authenticated` si le porteur a passé le défi 3-D Secure, sinon `null`.'
        created:
          $ref: '#/components/schemas/Timestamp'
      examples:
