            object:
              type: object
              description: Objet concerné (payment intent, charge, facture, …).
              additionalProperties: true
        created:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: evt_dDC6wOMJTGxBHuDMRaOJ9ZeX
          object: event
          type: payment_intent.succeeded
          data:
