      properties:
        id:
          type: string
          examples: [evt_dDC6wOMJTGxBHuDMRaOJ9ZeX]
        object:
          type: string
          enum: [event]
        type:
          $ref: '#/components/schemas/EventType'
        data:
          type: object
          required: [object]
