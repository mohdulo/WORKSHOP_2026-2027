            - { id: prod_le1wueOrEV7J6lxddLBmYl7A, price: price_MCaAxgAIzTRqSkuK4uIzyKTi, name: Planche à découper en noyer, description: 'Fabriquée à Lyon par l''Atelier Lyonnais, vendeur partenaire.', amount: 4800, currency: eur, marketplace: { seller: acct_HQht3neispyK1sG2zOmlom4U, seller_name: Atelier Lyonnais, platform_fee_percent: 15, application_fee_amount: 720 } }
          subscriptionPrice: { id: price_eLJ6zCcpewMTm5hdKtt3RvS2, product: prod_KoSziKXv6iLtNoQJrgDUdUKR, name: Café du mois, description: '250 g d''un café différent, livré chaque mois.', unit_amount: 990, currency: eur, interval: month }
