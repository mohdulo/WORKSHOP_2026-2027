          created: 1767225600
    EventList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    # ------------------------------------------------------------ Grand livre
    LedgerCheck:
      type: object
      required: [object, balanced, total, entries, unbalanced_transactions]
      properties:
        object:
          type: string
          enum: [ledger_check]
        balanced:
          type: boolean
        total:
          type: integer
          description: Somme de toutes les écritures (0 si équilibré).
        entries:
          type: integer
          description: Nombre d'écritures.
        unbalanced_transactions:
          type: array
          items:
            type: string
      examples:
        - { object: ledger_check, balanced: true, total: 0, entries: 31, unbalanced_transactions: [] }
    LedgerAccount:
      type: object
      required: [object, code, type, balance, net, entries]
      properties:
        object:
          type: string
          enum: [ledger_account]
        code:
          type: string
          description: '`network_receivable`, `platform_balance`, `psp_revenue`, `bank_payouts` ou `merchant:<acct_id>`.'
        type:
          type: string
          enum: [asset, liability, revenue]
        balance:
          type: integer
          description: Solde affiché (positif pour un passif créditeur).
        net:
          type: integer
          description: Somme signée des écritures (+ débit, − crédit).
        entries:
          type: integer
      examples:
        - { object: ledger_account, code: network_receivable, type: asset, balance: 13789, net: 13789, entries: 7 }
    LedgerAccountList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LedgerAccount'
    LedgerTransaction:
      type: object
      required: [id, object, kind, ref_id, created, entries]
      properties:
        id:
          type: string
          examples: [txn_4Z0JCA06qyno0N7aNLOsfw7h]
        object:
          type: string
          enum: [ledger_transaction]
        kind:
          type: string
          enum: [capture, refund, transfer, payout]
        ref_id:
          type: [string, 'null']
          description: Objet à l'origine de la transaction (`pi_…`, `re_…`, `tr_…`, `po_…`).
        created:
          $ref: '#/components/schemas/Timestamp'
        entries:
          type: array
          description: Écritures ; leur somme vaut 0.
          items:
            type: object
            required: [account, amount]
            properties:
              account:
                type: string
              amount:
                type: integer
                description: Signé (+ débit, − crédit).
      examples:
        - { id: txn_4Z0JCA06qyno0N7aNLOsfw7h, object: ledger_transaction, kind: capture, ref_id: pi_MR6CPNmfpuTMzysaMJBJPmHl, created: 1767225600, entries: [{ account: network_receivable, amount: 2500 }, { account: platform_balance, amount: -2500 }, { account: platform_balance, amount: 60 }, { account: psp_revenue, amount: -60 }] }
    LedgerTransactionList:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LedgerTransaction'

    # ------------------------------------------------------------ Horloge de test
    TestClock:
      type: object
      required: [object, now, frozen]
      properties:
        object:
          type: string
          enum: [test_clock]
        now:
          $ref: '#/components/schemas/Timestamp'
        frozen:
          type: boolean
          description: Vrai si l'horloge est gelée (tests) ; sur le serveur réel, le temps avance avec un décalage.
      examples:
        - { object: test_clock, now: 1767225600, frozen: false }
    TestClockAdvance:
      type: object
      required: [seconds]
      additionalProperties: false
      properties:
        seconds:
          type: integer
          minimum: 1
          maximum: 158112000
          description: Secondes à ajouter (entier > 0, au plus 5 ans).
    TestClockAdvanceResult:
      type: object
      required: [object, now, frozen, previous, advanced_by, results]
      properties:
        object:
          type: string
          enum: [test_clock]
        now:
          $ref: '#/components/schemas/Timestamp'
        frozen:
          type: boolean
        previous:
          $ref: '#/components/schemas/Timestamp'
        advanced_by:
          type: integer
        results:
          type: object
          required: [expired_authorizations, billing, hooks]
          properties:
            expired_authorizations:
              type: array
              description: 'Payment intents passés `canceled` (`cancellation_reason: expired`).'
              items:
                type: string
            billing:
              type: object
              description: Résumé du cycle de facturation.
              required: [subscriptions_processed, invoices_created, invoices_paid, payment_failures, subscriptions_canceled, errors]
              properties:
                subscriptions_processed:
                  type: integer
                invoices_created:
                  type: array
                  items:
                    type: string
                invoices_paid:
                  type: array
                  items:
                    type: string
                payment_failures:
                  type: array
                  items:
                    type: string
                subscriptions_canceled:
                  type: array
                  items:
                    type: string
                errors:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
            hooks:
              type: object
              description: Résultat de chaque tâche branchée sur l'horloge (`{ error }` si elle a échoué).
              properties:
                webhooks:
                  type: object
                  properties:
                    attempted:
                      type: integer
                    delivered:
                      type: array
                      items:
                        type: string
                    retry_scheduled:
                      type: array
                      items:
                        type: string
                    failed:
                      type: array
                      items:
                        type: string
                    error:
                      type: string
              additionalProperties: true
      examples:
        - { object: test_clock, now: 1769904000, frozen: false, previous: 1767225600, advanced_by: 2678400, results: { expired_authorizations: [pi_1GxsleS1xCacqXR9iWk4tx7p], billing: { subscriptions_processed: 1, invoices_created: [in_8Qm2kR0dT1Yv3WbL5nC7eA9z], invoices_paid: [in_8Qm2kR0dT1Yv3WbL5nC7eA9z], payment_failures: [], subscriptions_canceled: [], errors: [] }, hooks: { webhooks: { attempted: 4, delivered: [whd_Y5DbP7aDw77fG2mNYLNZSs8g], retry_scheduled: [], failed: [] } } } }

